# Serves the built React app and reverse-proxies /api to the backend container, so the
# browser sees one single origin for both the site and its API calls - closer to how a
# real deployment (Phase 17) looks than the two-origin dev setup (Vite on 5173 calling
# the API on 5053 directly, which is why that workflow needs CORS and this one doesn't).
server {
    listen 80;
    server_name _;

    # "backend" is this compose stack's service name (docker-compose.yml) - Docker's
    # internal DNS resolves it to the backend container's address on the shared network.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router handles routing client-side - a direct browser request for, say,
    # /company/dashboard has no matching file on disk, so it must fall back to
    # index.html and let the already-loaded JS take over from there.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
